<div class="container mt-4">
  <h2 class="mb-4">Employee List</h2>

  <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
    {{ successMessage }}
    <button type="button" class="btn-close" (click)="successMessage = ''"></button>
  </div>

  <div *ngIf="isLoading" class="text-center mt-5">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2">Loading employees...</p>
  </div>


  <div *ngIf="!isLoading && !hasData" class="text-center mt-5">
    <img src="https://cdn-icons-png.flaticon.com/512/7486/7486800.png" alt="No data" width="120" class="mb-3" />
    <h4>No employees found</h4>
    <p class="text-muted">Start by adding a new employee to your team.</p>
    <a [routerLink]="['/add']" class="btn btn-primary mt-2">
      <i class="bi bi-person-plus-fill"></i> Create Employee
    </a>
  </div>


  <div *ngIf="!isLoading && hasData" class="d-flex justify-content-between align-items-center mb-3">
    <input #searchInput type="text" class="form-control w-25"
           placeholder="Search by name"
           (keyup)="onSearch(searchInput.value)">
    <a routerLink="/add" class="btn btn-primary">
      <i class="bi bi-plus-circle-fill"></i> Add Employee
    </a>
  </div>

  <!-- Employee Table -->
  <table *ngIf="!isLoading && hasData" class="table table-bordered mt-3">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Position</th>
        <th class="border-0 text-center">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let emp of employees">
        <td>{{ emp.id }}</td>
        <td>{{ emp.firstName }} {{ emp.lastName }}</td>
        <td>{{ emp.email }}</td>
        <td>{{ emp.position }}</td>
        <td class="border-0 text-center">
          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-sm btn-warning" [routerLink]="['/edit', emp.id]">
              <i class="bi bi-pencil-fill"></i>
            </button>
            <button class="btn btn-sm btn-danger" (click)="deleteEmployee(emp.id)">
              <i class="bi bi-trash-fill"></i>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Pagination -->
  <nav *ngIf="totalPages > 1">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="loadEmployees(currentPage - 1)" [disabled]="currentPage === 1">
          Previous
        </button>
      </li>
      <li
        class="page-item"
        *ngFor="let pageNum of pages"
        [class.active]="pageNum === currentPage">
        <button class="page-link" (click)="loadEmployees(pageNum)">
          {{ pageNum }}
        </button>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="loadEmployees(currentPage + 1)" [disabled]="currentPage === totalPages">
          Next
        </button>
      </li>
    </ul>
  </nav>
</div>
